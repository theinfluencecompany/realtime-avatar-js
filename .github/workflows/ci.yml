name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the packages declare in `engines`, and current LTS.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: npm install
      - run: npm run typecheck
      # Build BEFORE test: libs/proxy resolves the client through node_modules, so its
      # tests need the built dist. This ordering caught a real failure on first CI run.
      - run: npm run build
      - run: npm test
      # Scans shipped JS, .d.ts AND sourcemaps. A sourcemap's sourcesContent embeds the
      # original source, so a clean source tree can still publish a leaky artifact.
      - run: npm run boundary
      # Cheap, catches the obvious: no credential should ever reach a commit here.
      - name: Scan for leaked credentials
        run: |
          if grep -rInE '(tic_(live|test)_[A-Za-z0-9]{8,}|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,})' \
             --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist .; then
            echo "::error::possible credential committed"; exit 1
          fi
          echo "no credential patterns found"
